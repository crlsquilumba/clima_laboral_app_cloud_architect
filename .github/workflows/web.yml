name: Deploy Web App

on:
  push:
    branches: [ develop ]
    paths:
      - 'apps/web/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Debug - Show current directory
        run: |
          pwd
          ls -la
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Install dependencies
        run: npm install

      - name: Debug - Show package.json
        run: |
          cat package.json
          echo "--- Workspace packages ---"
          npm run --workspaces --silent pkg

      - name: Build shared packages
        run: npm run build:shared

      - name: Build UI package
        run: npm run build:ui

      - name: Build Types package
        run: npm run build:types

      - name: Build web app
        run: npm run build:web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40428388EBA54656A4267A3CA5901835 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_492EDBA37C4348488665582D65BD7043 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_764FE1308B2342E7BBD1D41905232895 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'clima-laboral-web-app'
          slot-name: 'Production'
          package: .
